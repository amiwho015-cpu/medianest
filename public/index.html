<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediaNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Hind+Siliguri:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141a;--panel:#1a1e27;--line:#2a303c;--text:#e8eaf0;--muted:#8d95a6;--accent:#e8c27a;--ink:#1b1608;--err:#ff8a7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 "Hind Siliguri",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1{font:700 34px/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:8px 0 6px;letter-spacing:-.5px}
.sub{color:var(--muted);margin:0 0 22px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
nav button{flex:none;background:none;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:500}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 200px;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:10px;font:inherit}
select{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;font:inherit}
.out-media{max-width:100%;border-radius:10px;display:block;margin:6px 0}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go{background:var(--accent);color:var(--ink);border:0;padding:12px 20px;border-radius:10px;font:500 16px inherit;font-family:inherit;cursor:pointer}
.go[disabled]{opacity:.5}
#out{margin-top:16px}
.err{color:var(--err)}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img{width:84px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{color:var(--muted);font-size:14px}
.btn{display:inline-block;border:1px solid var(--accent);color:var(--accent);padding:6px 12px;border-radius:8px;text-decoration:none;font-size:14px;background:none;cursor:pointer;font-family:inherit;margin:2px 4px 2px 0}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.big{font:700 40px "Bricolage Grotesque",system-ui,sans-serif}
.note{color:var(--muted);font-size:13px;margin-top:22px}
@media (prefers-reduced-motion:no-preference){.go{transition:transform .1s}.go:active{transform:scale(.97)}}
</style>
</head>
<body>
<main>
  <h1>MediaNest</h1>
  <p class="sub">Link paste koro, download nao. Shob kichu ek jaygay.</p>
  <nav role="tablist" id="tabs"></nav>
  <section class="card">
    <form id="f"><select id="opt" hidden aria-label="Option"></select><input id="q" required autocomplete="off"><button class="go" id="b">Dhoro</button></form>
    <div id="out" aria-live="polite"></div>
  </section>
  <p class="note">Shudhu nijer ba onumoti thaka content download korun. Platform-er terms mene cholun.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); kids.forEach(k => e.append(k)); return e; };
const link = (href, text) => el('a', { href, target: '_blank', rel: 'noopener', className: 'btn', textContent: text });

const TOOLS = {
  video:  { label: 'Video Downloader', ph: 'Facebook / TikTok / Instagram / YouTube link', btn: 'Download', run: runVideo },
  yt:     { label: 'YouTube', ph: 'Gaan ba video-r naam likho', btn: 'Search', run: runYt },
  namaz:  { label: 'Namaz', ph: 'Shohor (jemon Dhaka)', btn: 'Dekho', run: runNamaz },
  weather:{ label: 'Weather', ph: 'Shohor (jemon Dhaka)', btn: 'Dekho', run: runWeather },
  image:  { label: 'AI Image', ph: 'Chhobi-r description likho', btn: 'Banao', run: runImage,
            opts: [['flux', 'Flux'], ['poli', 'Poli'], ['dalle3', 'DALL-E 3']] },
  song:   { label: 'AI Song', ph: 'Kemon gaan chao likho', btn: 'Banao', run: runSong,
            opts: [['15', '15 sec'], ['30', '30 sec'], ['60', '60 sec']] },
  spotify:{ label: 'Spotify', ph: 'Gaan-er naam', btn: 'Search', run: runSpotify },
  tiktok: { label: 'TikTok', ph: 'TikTok video search', btn: 'Search', run: runTiktok },
  font:   { label: 'Font Style', ph: 'Tomar lekha', btn: 'Dekho', run: runFont },
  waifu:  { label: 'Waifu', btn: 'Notun chhobi', run: runWaifu, noInput: true },
  flag:   { label: 'Flag Quiz', btn: 'Shuru koro', run: runFlag, noInput: true },
  short:  { label: 'Short Link', ph: 'Boro link paste koro', btn: 'Chhoto koro', run: runShort }
};
let cur = 'video';

async function api(path) {
  const r = await fetch(path);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Kichu ekta bhul hoyeche. Abar chesta koro.');
  return d;
}
const clear = () => $('out').replaceChildren();
const show = (...n) => { clear(); $('out').append(...n); };

async function runVideo(v) {
  const d = await api('/api/video?url=' + encodeURIComponent(v));
  const box = el('div');
  if (d.title) box.append(el('p', { textContent: d.title }));
  d.videos.slice(0, 4).forEach((u, i) => box.append(link(u, 'Video ' + (i + 1))));
  d.audios.slice(0, 2).forEach((u, i) => box.append(link(u, 'Audio ' + (i + 1))));
  show(box);
}
async function runYt(v) {
  const d = await api('/api/yt/search?q=' + encodeURIComponent(v));
  const box = el('div');
  d.results.forEach((r) => {
    const url = r.url || r.link;
    const t = el('div', { className: 't' }, el('b', { textContent: r.title || 'Untitled' }),
      el('span', { className: 'm', textContent: [r.duration || r.timestamp, r.author && (r.author.name || r.author)].filter(Boolean).join(' - ') }));
    const acts = el('div');
    ['mp3', 'mp4'].forEach((type) => {
      const b = el('button', { className: 'btn', textContent: type.toUpperCase() });
      b.onclick = async () => {
        b.textContent = '...';
        try { const x = await api('/api/yt/dl?type=' + type + '&url=' + encodeURIComponent(url)); window.open(x.url, '_blank', 'noopener'); b.textContent = type.toUpperCase(); }
        catch (e) { b.textContent = 'Fail'; }
      };
      acts.append(b);
    });
    t.append(acts);
    const img = r.thumbnail || r.thumb || r.image;
    box.append(el('div', { className: 'item' }, img ? el('img', { src: img, alt: '', loading: 'lazy' }) : '', t));
  });
  show(box);
}
async function runNamaz(v) {
  const d = await api('/api/namaz?city=' + encodeURIComponent(v));
  show(...Object.entries(d.timings).map(([k, t]) => el('div', { className: 'row' }, el('span', { textContent: k }), el('b', { textContent: t }))));
}
async function runWeather(v) {
  const d = await api('/api/weather?city=' + encodeURIComponent(v));
  show(el('div', { className: 'big', textContent: Math.round(d.temp) + '\u00B0C' }),
    el('p', { textContent: d.city + ' - ' + d.desc }),
    el('p', { className: 'm', textContent: 'Feels like ' + Math.round(d.feels) + '\u00B0C, humidity ' + d.humidity + '%, wind ' + d.wind + ' m/s' }));
}
async function runShort(v) {
  const d = await api('/api/short?url=' + encodeURIComponent(v));
  const b = el('button', { className: 'btn', textContent: 'Copy' });
  b.onclick = () => navigator.clipboard.writeText(d.short).then(() => (b.textContent = 'Copied'));
  show(el('p', { textContent: d.short }), b);
}


async function blobUrl(path) {
  const r = await fetch(path);
  if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || 'Kichu ekta bhul hoyeche. Abar chesta koro.'); }
  return URL.createObjectURL(await r.blob());
}
async function runImage(v) {
  const u = await blobUrl('/api/ai/image?model=' + $('opt').value + '&prompt=' + encodeURIComponent(v));
  show(el('img', { src: u, alt: v, className: 'out-media' }), link(u, 'Save'));
  $('out').lastChild.download = 'image.png';
}
async function runSong(v) {
  const u = await blobUrl('/api/ai/song?duration=' + $('opt').value + '&prompt=' + encodeURIComponent(v));
  show(el('audio', { src: u, controls: true, className: 'out-media' }), link(u, 'Save'));
  $('out').lastChild.download = 'song.mp3';
}
async function runSpotify(v) {
  const d = await api('/api/spotify/search?q=' + encodeURIComponent(v));
  const box = el('div');
  d.results.forEach((r) => {
    const b = el('button', { className: 'btn', textContent: 'MP3' });
    b.onclick = async () => { b.textContent = '...'; try { const x = await api('/api/spotify/dl?url=' + encodeURIComponent(r.url || r.link)); window.open(x.url, '_blank', 'noopener'); b.textContent = 'MP3'; } catch (e) { b.textContent = 'Fail'; } };
    box.append(el('div', { className: 'item' }, el('div', { className: 't' }, el('b', { textContent: r.title }), el('span', { className: 'm', textContent: r.artist || '' })), b));
  });
  show(box);
}
async function runTiktok(v) {
  const d = await api('/api/tiktok?q=' + encodeURIComponent(v));
  const box = el('div');
  d.results.forEach((r) => box.append(el('div', { className: 'item' },
    r.thumbnail ? el('img', { src: r.thumbnail, alt: '', loading: 'lazy' }) : '',
    el('div', { className: 't' }, el('b', { textContent: r.title || r.desc || 'TikTok video' })), link(r.video_url, 'Video'))));
  show(box);
}
async function runFont(v) {
  const d = await api('/api/font?style=List&text=' + encodeURIComponent(v));
  const box = el('div');
  Object.entries(d.previews || {}).forEach(([id, sample]) => {
    const b = el('button', { className: 'btn', textContent: 'Copy' });
    b.onclick = async () => { const x = await api('/api/font?style=' + id + '&text=' + encodeURIComponent(v)); await navigator.clipboard.writeText(x.result); b.textContent = 'Copied'; };
    box.append(el('div', { className: 'row' }, el('span', { textContent: sample }), b));
  });
  show(box);
}
async function runWaifu() {
  const d = await api('/api/waifu');
  show(el('img', { src: d.url, alt: 'waifu', className: 'out-media', referrerPolicy: 'no-referrer' }));
}
async function runFlag() {
  const d = await api('/api/flag');
  const box = el('div', {}, el('img', { src: d.flag_image, alt: 'Flag', className: 'out-media' }), el('p', { textContent: 'Ei flag kon desher?' }));
  const msg = el('p');
  d.options.forEach((o) => {
    const b = el('button', { className: 'btn', textContent: o });
    b.onclick = () => { msg.textContent = o === d.correct_answer ? 'Thik uttor!' : 'Bhul. Uttor: ' + d.correct_answer; };
    box.append(b);
  });
  box.append(msg); show(box);
}

function pick(name) {
  cur = name; const t = TOOLS[name];
  $('q').hidden = !!t.noInput; $('q').required = !t.noInput; $('q').placeholder = t.ph || ''; $('q').value = '';
  $('opt').hidden = !t.opts; $('opt').replaceChildren(...(t.opts || []).map(([v, l]) => el('option', { value: v, textContent: l })));
  $('b').textContent = t.btn; clear();
  [...$('tabs').children].forEach((c) => c.setAttribute('aria-selected', c.dataset.k === name));
}
Object.entries(TOOLS).forEach(([k, t]) => {
  const b = el('button', { textContent: t.label, role: 'tab' }); b.dataset.k = k;
  b.onclick = () => pick(k); $('tabs').append(b);
});
$('f').onsubmit = async (e) => {
  e.preventDefault(); $('b').disabled = true; show('Kaj hocche...');
  try { await TOOLS[cur].run($('q').value.trim()); }
  catch (err) { show(el('span', { className: 'err', textContent: err.message })); }
  $('b').disabled = false;
};
pick('video');
</script>
</body>
</html>
